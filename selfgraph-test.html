<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SelfGraph Test Run</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#16191d;--mut:#5f6b78;--line:#dde2e8;--person:#2f6fdc;--company:#0f9d6b;--thing:#8a6d3b;--retired:#c2410c;--ok:#0f9d6b;--warn:#b45309;--code:#f0f2f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#161b22;--fg:#e6edf3;--mut:#9aa6b2;--line:#2d333b;--person:#6ea3ff;--company:#3fcf96;--thing:#d4a85a;--retired:#fb923c;--ok:#3fcf96;--warn:#f5b041;--code:#0d1117}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b22;--fg:#e6edf3;--mut:#9aa6b2;--line:#2d333b;--person:#6ea3ff;--company:#3fcf96;--thing:#d4a85a;--retired:#fb923c;--ok:#3fcf96;--warn:#f5b041;--code:#0d1117}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:26px;margin:0 0 4px}.lede{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.card h2{font-size:18px;margin:0 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.q{font:13px ui-monospace,Menlo,monospace;color:var(--mut);margin:0 0 4px}
.empty{color:var(--warn);font-style:italic}
input[type=range]{width:100%}
.slider{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.asof{font-weight:700;font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
</style></head><body><main>
<h1>SelfGraph: Test Run</h1>
<p class="lede">selfgraph 0.2.2 from source, embedded Kuzu database, no LLM, no server. Each graph below is read back from the database after the test.</p>
<div id="app"></div>
<div class="legend"><span><i style="background:var(--person)"></i>Person</span><span><i style="background:var(--company)"></i>Company</span><span><i style="background:var(--thing)"></i>Thing (untyped)</span><span><i style="background:var(--retired)"></i>Retired relation</span></div>
</main>
<script>
const D=[{"store": "q.kuzu", "entities": [{"id": "company:acme", "type": "Company", "name": "Acme"}, {"id": "person:jane", "type": "Person", "name": "Jane Doe"}], "relations": [{"id": "relation:ec6ca7724d4851341629a9b9", "from": "person:jane", "to": "company:acme", "type": "WORKS_AT", "current": true, "event_time": null, "invalidated_by": null}], "queries": [{"q": "who works at Acme", "context": "GRAPH | Jane Doe -[WORKS_AT]-> Acme\nGRAPH | Acme [Company]\nGRAPH | Jane Doe [Person]"}], "answerable": null}, {"store": "t.kuzu", "entities": [{"id": "company:acme", "type": "Company", "name": "Acme"}, {"id": "company:globex", "type": "Company", "name": "Globex"}, {"id": "person:ann", "type": "Person", "name": "Ann"}], "relations": [{"id": "relation:a4b698967fceb2c72cc81f83", "from": "person:ann", "to": "company:acme", "type": "WORKS_AT", "current": false, "event_time": "2020-01-01 00:00:00+00:00", "invalidated_by": "relation:e67c4dd3e99c5d9097f4be29"}, {"id": "relation:e67c4dd3e99c5d9097f4be29", "from": "person:ann", "to": "company:globex", "type": "WORKS_AT", "current": true, "event_time": "2022-01-01 00:00:00+00:00", "invalidated_by": null}], "queries": [{"q": "where does Ann work", "context": "GRAPH | Ann -[WORKS_AT]-> Globex\nGRAPH | Ann [Person]\nGRAPH | Globex [Company]"}, {"q": "where does Ann work", "as_of": "2021-06-01", "context": "GRAPH | Ann -[WORKS_AT]-> Acme\nGRAPH | Ann [Person]\nGRAPH | Acme [Company]"}], "answerable": null}, {"store": "x.kuzu", "entities": [{"id": "thing:hydradb", "type": "Thing", "name": "HydraDB"}, {"id": "thing:soham", "type": "Thing", "name": "Soham"}], "relations": [{"id": "relation:f99886e89c18a2269eed1b08", "from": "thing:soham", "to": "thing:hydradb", "type": "RELATED_TO", "current": true, "event_time": null, "invalidated_by": null}], "queries": [{"q": "which database did the team pick", "context": ""}], "answerable": {"q": "What is the revenue of HydraDB?", "verdict": "partial", "missing": ["revenue"], "terms": [{"term": "revenue", "status": "missing"}, {"term": "hydradb", "status": "entity"}]}}];
const col=t=>({Person:'var(--person)',Company:'var(--company)'}[t]||'var(--thing)');
function graph(ents,rels,pos,opts={}){
  const W=420,H=opts.h||190;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><defs>
  <marker id="a-${opts.k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--mut)"/></marker>
  <marker id="r-${opts.k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--retired)"/></marker></defs>`;
  for(const r of rels){const a=pos[r.from],b=pos[r.to];if(!a||!b)continue;
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,R=34;
    const x1=a[0]+ux*R,y1=a[1]+uy*R,x2=b[0]-ux*(R+3),y2=b[1]-uy*(R+3);
    const live=opts.live?opts.live(r):r.current;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${live?'var(--mut)':'var(--retired)'}" stroke-width="2" ${live?'':'stroke-dasharray="5 4"'} marker-end="url(#${live?'a':'r'}-${opts.k})" style="transition:all .3s"/>`;
    const mx=(x1+x2)/2,my=(y1+y2)/2-8;
    s+=`<text x="${mx}" y="${my}" text-anchor="middle" font-size="11" font-weight="600" fill="${live?'var(--fg)':'var(--retired)'}">${r.type}${live?'':' (retired)'}</text>`;
    if(r.event_time)s+=`<text x="${mx}" y="${my+26}" text-anchor="middle" font-size="10" fill="var(--mut)">since ${r.event_time.slice(0,10)}</text>`;}
  for(const e of ents){const p=pos[e.id];if(!p)continue;
    s+=`<circle cx="${p[0]}" cy="${p[1]}" r="32" fill="var(--card)" stroke="${col(e.type)}" stroke-width="3"/>
    <text x="${p[0]}" y="${p[1]+1}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fg)">${e.name}</text>
    <text x="${p[0]}" y="${p[1]+15}" text-anchor="middle" font-size="10" fill="${col(e.type)}">${e.type}</text>`;}
  return s+'</svg>';}
const qa=q=>`<p class="q">retrieve("${q.q}"${q.as_of?`, as_of="${q.as_of}"`:''})</p>`+(q.context?`<pre>${q.context}</pre>`:`<pre class="empty">(empty: nothing found)</pre>`);
const [t1,t2,t3]=D;
let h='';
h+=`<section class="card"><h2>1. Facts in, question out <span class="pill ok">pass</span></h2><p class="sub">Inserted Jane, Acme and a WORKS_AT link as structured facts, then asked in plain English.</p>
<div class="grid"><div><p class="label">Graph in the database</p>${graph(t1.entities,t1.relations,{'person:jane':[90,95],'company:acme':[330,95]},{k:1})}</div><div><p class="label">Answer</p>${t1.queries.map(qa).join('')}</div></div></section>`;
h+=`<section class="card"><h2>2. Facts that change, and time travel <span class="pill ok">pass</span></h2><p class="sub">Ann joined Acme in 2020, then Globex in 2022. The schema allows one employer, so the newer fact retires the older one. Nothing is deleted. Drag the slider to read the graph "as of" a date.</p>
<div class="grid"><div><p class="label">Graph as of <span class="asof" id="asofv"></span></p><div id="g2"></div>
<input type="range" id="sl" min="0" max="47" value="47"><div class="slider"><span>Jan 2020</span><span>Dec 2023</span></div></div>
<div><p class="label">Real answers from SelfGraph</p>${t2.queries.map(qa).join('')}<p class="label" style="margin-top:12px">Stored relations</p><table><tr><th>Link</th><th>Since</th><th>Status</th></tr>${t2.relations.map(r=>`<tr><td>Ann → ${r.to.split(':')[1].replace(/^./,c=>c.toUpperCase())}</td><td>${r.event_time.slice(0,10)}</td><td class="${r.current?'ok':'warn'}">${r.current?'current':'retired, replaced'}</td></tr>`).join('')}</table></div></div></section>`;
h+=`<section class="card"><h2>3. Plain text in, no LLM <span class="pill warn">weak</span></h2><p class="sub">Input: "Soham prefers HydraDB. The team picked HydraDB for temporal history." Without an LLM or spaCy it falls back to pattern matching: both names become untyped <b>Thing</b>s with a generic link, so the question finds nothing.</p>
<div class="grid"><div><p class="label">Graph in the database</p>${graph(t3.entities,t3.relations,{'thing:soham':[90,95],'thing:hydradb':[330,95]},{k:3})}</div><div><p class="label">Answer</p>${t3.queries.map(qa).join('')}</div></div></section>`;
const a=t3.answerable;
h+=`<section class="card"><h2>4. Knows what it doesn't know <span class="pill ok">pass</span></h2><p class="sub"><code>check_answerable("${a.q}")</code>, with no LLM call.</p>
<table><tr><th>Term</th><th>In the graph?</th></tr>${a.terms.map(t=>`<tr><td>${t.term}</td><td class="${t.status=='missing'?'warn':'ok'}">${t.status=='missing'?'missing':'yes, as an '+t.status}</td></tr>`).join('')}</table><p class="sub" style="margin-top:8px">Verdict: <b>${a.verdict}</b>. It knows HydraDB but has no revenue data, so an agent should not answer.</p></section>`;
document.getElementById('app').innerHTML=h;
const pos2={'person:ann':[80,95],'company:acme':[330,45],'company:globex':[330,150]};
function draw(){const m=+document.getElementById('sl').value,y=2020+Math.floor(m/12),mo=m%12+1,d=`${y}-${String(mo).padStart(2,'0')}-01`;
  document.getElementById('asofv').textContent=new Date(d).toLocaleDateString('en',{month:'short',year:'numeric'});
  const rs=t2.relations.filter(r=>r.event_time.slice(0,10)<=d);
  const newest=rs.reduce((b,r)=>!b||r.event_time>b.event_time?r:b,null);
  document.getElementById('g2').innerHTML=graph(t2.entities,rs,pos2,{k:2,live:r=>r===newest});}
document.getElementById('sl').addEventListener('input',draw);draw();
</script></body></html>
